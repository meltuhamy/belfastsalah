<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prayer Times</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="description"
      content="Prayer times for Belfast and London, straight from the mosque timetable."
    />

    <link rel="manifest" href="/manifest.json" />
    <!-- assets/icon/favicon.png went with the CRA layout; these are the ones
         `npm run assets` generates and manifest.json points at. -->
    <link rel="icon" type="image/webp" sizes="48x48" href="/assets/icons/icon-48.webp" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icon/icon.png" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.webp" />

    <!-- add to homescreen for ios -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Prayer Times" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>

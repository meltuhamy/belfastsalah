name: Android emulator
description: >-
  Runs commands on the emulator every Android job uses - a Pixel 6 on API 34 -
  from the android directory.

inputs:
  script:
    description: >-
      Commands to run once the emulator has booted. Each line runs on its own,
      and the first one to fail ends the script.
    required: true
  emulator-options:
    description: Extra emulator flags, such as -timezone Europe/London
    default: ""

runs:
  using: composite
  steps:
    # Hardware acceleration. Linux runners have KVM, but only root can use it
    # until this opens it up.
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot ${{ inputs.emulator-options }}
        working-directory: android
        script: ${{ inputs.script }}

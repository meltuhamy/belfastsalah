name: Set up
description: >-
  Node and the npm dependencies. For android or ios, also that platform's
  toolchain and the web build synced into its native project. With fastlane,
  also Ruby and the gems in Gemfile.lock.

inputs:
  platform:
    description: web, android or ios
    default: web
  fastlane:
    description: Also install Ruby and fastlane ("true" or "false")
    default: "false"

runs:
  using: composite
  steps:
    # The Node version lives in .nvmrc and nowhere else.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    # Java 21, which Capacitor 8 compiles for. Gradle's dependency cache comes
    # from setup-java rather than gradle/actions, whose caching became a
    # proprietary component with terms of its own in v6.
    - if: inputs.platform == 'android'
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: 21
        cache: gradle

    - if: inputs.platform == 'android'
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

    # Ruby from .ruby-version, fastlane from Gemfile.lock, both cached.
    - if: inputs.fastlane == 'true'
      uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
      with:
        bundler-cache: true

    - name: Install npm dependencies
      shell: bash
      run: npm ci

    - name: Build the web app into the native project
      if: inputs.platform == 'android' || inputs.platform == 'ios'
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        npx vite build
        npx cap sync "$PLATFORM"

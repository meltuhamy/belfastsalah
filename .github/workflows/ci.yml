name: CI

# Lint, tests and native builds. Runs on every push to a branch, so the Android
# and iOS toolchains are checked before a pull request exists - this is the
# only place they are. On master it runs inside release.yml instead, which only
# releases a commit that passes.
#
# Pull requests run it only when they come from forks, whose pushes do not run
# here. A branch of this repository already gets the push run, for the same
# commit, and GitHub shows it on the pull request; running again for the pull
# request doubled every job. Each job carries the condition, as workflows
# cannot.

on:
  push:
    branches-ignore: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# The literal "ci-" matters: inside release.yml, github.workflow is the
# caller's name, and a group the caller already holds would deadlock.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflows
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Correctness: expressions, job and action inputs, and shellcheck on
      # every run step.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

      # Security: template injection, over-broad permissions, unpinned actions,
      # credentials left lying around.
      - name: zizmor
        run: pipx run zizmor==1.30.1 --offline --format=github .

  web:
    name: Lint, typecheck, test, build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # test:zones rather than test: the app reads and renders the timetable in
      # its own zone, and a suite that only passes in the runner's zone is how
      # the original wrong-day-abroad bug survived.
      - name: Test
        run: npm run test:zones

      - name: Build
        run: npx vite build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-build
          path: build
          retention-days: 30

  e2e:
    name: Browser tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

  android:
    name: Android debug build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          platform: android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # The widgets, on the JVM through Robolectric: the payload they read,
      # what each one shows at a given moment, whether its text fits at the
      # sizes it is used at, and screenshots compared against the committed
      # ones in android/app/src/test/screenshots.
      #
      # The comparison is skipped while record-widget-screenshots.yml is
      # replacing those references - on a commit that asks it to, or before
      # there are any - and every other assertion still runs.
      - name: Android unit tests
        working-directory: android
        env:
          RECORDING: ${{ contains(github.event.head_commit.message, '[record screenshots]') }}
        run: |
          if [ "$RECORDING" = "true" ] || [ ! -d app/src/test/screenshots ]; then
            ./gradlew testDebugUnitTest --no-daemon
          else
            ./gradlew verifyRoborazziDebug --no-daemon
          fi

      # What a failure looks like: the test report, and for a screenshot that
      # changed, the new image and a diff against the reference.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: android-unit-test-results
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/outputs/roborazzi
          retention-days: 30

      # The Play Store takes an app bundle, not an APK, and that is a different
      # Gradle task with its own way of failing. Building it unsigned here
      # means a broken release build surfaces on an ordinary push rather than
      # on the merge that was meant to ship it.
      - name: Assemble release bundle (unsigned)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ios:
    name: iOS build (unsigned)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # macOS runners are free and unmetered on public repositories.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          platform: ios

      # No signing here, so this only proves the project compiles. Signed
      # builds come from release.yml.
      - name: Build without signing
        working-directory: ios/App
        run: |
          xcodebuild \
            -scheme App \
            -project App.xcodeproj \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      # The widgets, on a simulator: the payload as the TypeScript writes it
      # (fixtures/widget-payload), the timeline built from it, the App Group
      # the app and the widget share, whether any text is cut off, and
      # snapshots compared against ios/App/PrayerWidgetsTests/__Snapshots__.
      #
      # Signed ad hoc (AdHocSigning.xcconfig) rather than not at all: a
      # simulator only grants entitlements - the App Group among them - to a
      # signed app, and that needs no certificate.
      #
      # As on Android, the snapshot comparison is skipped while
      # record-widget-screenshots.yml is replacing the references, or before
      # there are any; every other test still runs.
      - name: Boot a simulator
        id: sim
        run: echo "udid=$(scripts/ios/boot-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Widget tests
        working-directory: ios/App
        env:
          RECORDING: ${{ contains(github.event.head_commit.message, '[record screenshots]') }}
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          skip=()
          if [ "$RECORDING" = "true" ] || [ ! -d PrayerWidgetsTests/__Snapshots__ ]; then
            skip=(-skip-testing:PrayerWidgetsTests/WidgetSnapshotTests)
          fi
          xcodebuild test \
            -project App.xcodeproj \
            -scheme PrayerWidgetsTests \
            -destination "id=$UDID" \
            -derivedDataPath build \
            -resultBundlePath "$RUNNER_TEMP/PrayerWidgetsTests.xcresult" \
            -xcconfig AdHocSigning.xcconfig \
            "${skip[@]}"

      # The logic again in zones far from London. Nothing on the native side
      # should do calendar arithmetic, and this is what would catch it if it
      # started to - as test:zones does for the TypeScript.
      - name: Widget logic in other time zones
        working-directory: ios/App
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          for zone in Pacific/Auckland America/Los_Angeles Asia/Dubai; do
            echo "--- TZ=$zone ---"
            TEST_RUNNER_TZ="$zone" xcodebuild test-without-building \
              -project App.xcodeproj \
              -scheme PrayerWidgetsTests \
              -destination "id=$UDID" \
              -derivedDataPath build \
              -only-testing:PrayerWidgetsTests/WidgetPayloadTests \
              -only-testing:PrayerWidgetsTests/PrayerTimelineTests \
              -xcconfig AdHocSigning.xcconfig
          done

      # What a failure looks like: the result bundle, and for a snapshot that
      # changed, the new image beside the reference.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ios-widget-test-results
          path: ${{ runner.temp }}/PrayerWidgetsTests.xcresult
          retention-days: 30

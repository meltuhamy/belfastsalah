name: Release iOS

# Produces a signed IPA and uploads it to TestFlight.
# macOS runners are free and unmetered on public repositories.
#
# Signing is Xcode's own automatic signing ("cloud signing"), authorised by
# an App Store Connect API key: Xcode registers the profiles for the app and
# the widget extension, and signs with a cloud-managed distribution
# certificate. No certificate or profile is stored here.
#
# Required repository secrets:
#   APP_STORE_CONNECT_KEY_ID       - App Store Connect API key id
#   APP_STORE_CONNECT_ISSUER_ID    - App Store Connect issuer id
#   APP_STORE_CONNECT_KEY_CONTENT  - base64 of the .p8 key file
#                                    base64 -i AuthKey_XXXX.p8 | pbcopy
# The key needs the Admin role: cloud-managed certificates require it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: npm ci

      - name: Build web assets and sync
        run: |
          npx vite build
          npx cap sync ios

      - name: Write the API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_CONTENT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set; see RELEASING.md."
              exit 1
            fi
          done
          # xcodebuild only takes the key as a file.
          echo "$APP_STORE_CONNECT_KEY_CONTENT" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          if ! grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/AuthKey.p8"; then
            echo "::error::APP_STORE_CONNECT_KEY_CONTENT is not the base64 of a .p8 file."
            exit 1
          fi

      - name: Build and upload
        env:
          CI: "true"
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane ios beta

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ios-ipa
          path: build/ios/*.ipa
          retention-days: 30

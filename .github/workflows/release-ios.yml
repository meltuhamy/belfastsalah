name: Release iOS

# Produces a signed IPA and uploads it to TestFlight.
# macOS runners are free and unmetered on public repositories.
#
# Required repository secrets:
#   APP_STORE_CONNECT_KEY_ID       - App Store Connect API key id
#   APP_STORE_CONNECT_ISSUER_ID    - App Store Connect issuer id
#   APP_STORE_CONNECT_KEY_CONTENT  - base64 of the .p8 key file
#                                    base64 -i AuthKey_XXXX.p8 | pbcopy
#   IOS_CERTIFICATE_BASE64         - base64 of your distribution cert (.p12)
#   IOS_CERTIFICATE_PASSWORD       - password for that .p12
#   IOS_PROVISIONING_PROFILE_BASE64 - base64 of the .mobileprovision

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: npm ci

      - name: Build web assets and sync
        run: |
          npx vite build
          npx cap sync ios

      - name: Install signing certificate and profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$IOS_CERTIFICATE_BASE64" | base64 -d > "$CERT_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build and upload
        env:
          CI: "true"
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane ios beta

      - name: Clean up keychain and profile
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ios-ipa
          path: build/ios/*.ipa
          retention-days: 30
